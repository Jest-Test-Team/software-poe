name: Julia TagBot

# Registration flow for SoftwarePOE.jl (sdk/julia):
# 1. Bump version in sdk/julia/Project.toml and merge to main.
# 2. Comment on that commit: @JuliaRegistrator register subdir=sdk/julia
# 3. After the General registry PR merges, TagBot creates the release tag here.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  issues: read
  pull-requests: read
  statuses: read

jobs:
  tagbot:
    if: github.event_name != 'issue_comment' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: sdk/julia
