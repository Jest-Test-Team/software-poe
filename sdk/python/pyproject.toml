[project]
name = "software-poe"
version = "0.1.0"
description = "Client SDK for Software POE (post-occupancy evaluation for software architecture)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jest-Test-Team" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Jest-Test-Team/software-poe"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_poe"]
